[project]
name = "paimon-backend"
version = "0.1.0"
description = "PAIMON cloud orchestrator — modular monolith (Vani, Narada, Tattva, Manas, Sakshi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "faster-whisper>=1.0.3",
    "edge-tts>=6.1.0",
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.12.1",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's dependency-injection pattern (File(...), Depends(...), Query(...))
# intentionally calls functions in argument defaults — not a bug here.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
